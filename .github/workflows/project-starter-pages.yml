name: Publish U-GAS Project Starter

on:
  push:
    branches: [main]
    paths:
      - "starter/**"
      - ".github/workflows/project-starter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Starter artifact
        run: |
          mkdir -p _site/starter
          cp -R starter/. _site/starter/
          cp starter/index.html _site/index.html
          printf "User-agent: *\nAllow: /\n\nSitemap: https://jaabster-dev.github.io/u-gas/sitemap.xml\n" > _site/robots.txt
          printf "%s\n" "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" "<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">" "  <url><loc>https://jaabster-dev.github.io/u-gas/</loc></url>" "  <url><loc>https://jaabster-dev.github.io/u-gas/starter/</loc></url>" "</urlset>" > _site/sitemap.xml

      - name: Upload Starter artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
